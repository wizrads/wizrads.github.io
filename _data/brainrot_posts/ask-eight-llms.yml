# Brainrot mode for /ask-eight-llms/.
#
# The file name is the post's slug, and that is the whole wiring: _layouts/
# single.html looks for _data/brainrot_posts/<slug>.yml and, where one exists,
# renders the toggle above the post body. Nothing goes in the post's front
# matter. Drop a file in here for the next post and it gets a slider too.
#
# page:      keys match data-brainrot="..." attributes on elements in the post.
#            posttitle is the one reserved key - it swaps the <h1> the layout
#            renders from the front-matter title. A key with no element, or an
#            element with no key, is skipped, so editing the real copy can never
#            break the page; that block just stops translating.
# hint:      optional replacement for the toggle's "translate this page" hint.
#
# nav:, bio: and the gutter clips come from _data/brainrot.yml and are shared
# by every page that has a toggle.
#
# Register: all lowercase, heavy slang, several emoji a paragraph. Emoji are
# plain characters rendered by the system emoji font, so none of them costs a
# request. Values are injected as HTML, so carry over any markup the real copy
# had (the conflict-of-interest block keeps its <strong>, and the &mdash; and
# &ldquo; entities stay entities).
#
# Deliberately NOT translated, because they are quotations of what actually
# happened and a funnier wording would make them wrong: the prompt box, Grok's
# refusal in the pull quote, the model lineup and settings tables, and every
# figcaption (those are the methods notes for the charts). Every number that
# survives into a translation below is the real one - the slang is turned all
# the way up, the facts are not touched.

hint: "translate this post into Gen Alpha ✨🧠💀"

page:
  posttitle: "which med phys program is actually goated? 🐐 I made eight LLMs spill 🤖🫗"

  lede: >
    chat 🗣️, everyone in this field gets asked which program is the GOAT 🐐 and
    everyone has takes 🎤. nobody has an actual ranking though ❌📋. US News ranks
    law schools ⚖️, business schools 💼, hospitals 🏥 and engineering departments
    🔧, and skips graduate medical physics entirely 💀☢️. so I got curious 🤔 and
    made the machines spill 🤖🫗.

  coi: >
    <strong>conflict of interest, said up front 🚨:</strong> I am a PhD student at
    Wisconsin 🦡, which finished FIRST 🥇🏆. weigh everything below accordingly
    ⚖️. yes it is sus 🤨📮.

  intro-rankings: >
    rankings are just some guy 🧍 picking the criteria, weighting them, and
    posting the result 📤. medical physics never got that treatment 😔. tiny field
    🤏 &mdash; under a hundred accredited graduate programs in the entire US 🇺🇸
    &mdash; and no major outlet bothers to rank them 📰❌. applicants just ask
    around 👂🗣️, which is exactly how I ended up with opinions of my own 💭😤.

  intro-ask: >
    increasingly, applicants just ask a chatbot instead 🤖💬. I wanted to see what
    it would tell them 👀. so I hit eight large language models, one from each
    major company 🏢, with the same question in a fresh chat with zero memory 🧠❌
    of the last one:

  intro-counts: >
    ten runs per model 🔁 = eighty answers on that wording alone 🧾. then two
    rewordings ✍️, plus a master&rsquo;s version 🎓 and a doctoral version 👨‍🔬,
    for 320 answers total 💯. one call at a time 📞, every one logged 📝, response
    hashed #️⃣, and I checked whose servers actually picked up 🖥️👀. receipts on
    receipts on receipts 🧾🧾🧾.

  intro-lineup: >
    here is the lineup 📋🔥. one model per company, pinned to an exact version and
    serving provider 📌 so the same weights answered every single time 🔒⚖️:

  intro-settings: >
    two of the eight will not take a temperature setting at all 🌡️❌, and four
    cannot switch their reasoning off 🧠🔛, so those ran at the lowest effort their
    provider allows 😴. holding all eight to identical settings is straight up
    impossible 🤷, so the table logs what each one actually accepted ✅. it is what
    it is 🫠.

  intro-what: >
    what comes back is a ranking 📊. a CONFIDENT one 😎, clear favourites 💅,
    respectable looking tail 🐍. only question that matters: what is it actually
    made of 👀🍳❓

  herostat: >
    published rankings of US graduate medical physics programs existed before this
    one 📚❌. the models produced a top 15 anyway 🤡 and largely agreed with each
    other 🤝. confidently incorrect behaviour, certified 💀📜.

  fig-board-title: "the consensus top 15 🏆👑"
  fig-board-sub: "pooled across 8 models 🤖, 10 answers each 🔁. one vote per model 🗳️"

  h2-holds: "ok the list is lowkey valid 😳✅"

  holds-1: >
    thirteen of the fifteen hold CAMPEP accreditation ✅📜, which is the
    field&rsquo;s actual quality bar and the closest thing to an answer key 🔑.
    Wisconsin 🦡, MD Anderson 🤠 and Duke 😈 lead, and honestly any medical
    physicist would put those three near the top of their own list 💯. for a
    ranking assembled by next-token prediction 🎰 that is a respectable showing.
    respect 🫡🔥.

  holds-2: >
    two do NOT belong ❌🚨. Michigan lands fifth and Harvard tenth, and neither one
    appears on the CAMPEP graduate program list 📋🚫. Michigan showed up in 58 of
    80 answers 😭, so the models are fully locked in on it 🔒. delulu but committed
    💍🤡.

  holds-3: >
    across every answer the models named 59 distinct schools 🏫, and 35 of those
    hold no accredited graduate program in the field ❌. most appear once or twice
    👻. the models know the top of the field 🧠 and then start straight freestyling
    🎤🔥 below it, which is roughly what a well-read undergraduate would do 📚😅.

  fig-three-title: "master&rsquo;s or doctoral? the models are just vibing 🎧😐"
  fig-three-sub: "all fifteen for each phrasing 🗣️. rank sits at the left of each row ⬅️"

  h2-where: "so where is it even getting this 🧐🔍"

  where-1: >
    across the 79 graduate answers the models named 35 schools that hold no
    CAMPEP-accredited graduate program ❌📜. narrower claim than it sounds though
    🤏. CAMPEP accredits graduate programs, residencies 🏥 and certificate programs
    📄 on separate lists, and several of these schools DO run an accredited
    residency or certificate program ✅. what none of them runs is an accredited
    graduate program 🎓, which is literally what the prompt asked for 💀.

  where-2: >
    look at the list and the pattern is obvious 👁️. these are famous universities
    🏛️✨. the models are reaching for general institutional aura 🌌 and letting it
    stand in for a field they have little specific information about 🤷, which is
    roughly what a well-read undergraduate would do when put on the spot 😬📚. aura
    farming, basically 🌾.

  fig-notelig-title: "schools with NO accredited GRADUATE program in medical physics 🚫🎓"
  fig-notelig-sub: "times named across the 79 graduate answers 🔢. darker segment counts top-ten finishes 🌑"

  fig-share-title: "rewording the question does basically nothing 🔁😑"
  fig-share-sub: >
    each answer hands out ten top-ten places 🎟️. the share of them that went to a
    school running no accredited graduate program ❌🎓

  h2-agree: "do they even agree with each other 🤝❓"

  agree-1: >
    at the top? hard yes 💯🔒. Wisconsin 🦡, MD Anderson 🤠 and Duke 😈 clear nine
    of ten from almost every model. past Chicago the grid falls APART 💥, and
    several schools survive purely on one model&rsquo;s personal agenda 😤. Gemini
    alone carries Johns Hopkins ♊🎒. DeepSeek alone carries UC Berkeley/UCSF 🐋🎒.
    solo carry, no team 🎮🫡.

  fig-heat-title: "who picked whom 👀🫵"
  fig-heat-sub: "how many of each model&rsquo;s 10 answers put the school in its top ten 🔢"

  h2-refused: "one model refused to play 🚫🎮"

  refused-1: >
    Grok answered the graduate question ten times 🔟. nine times it produced a tidy
    little list of fifteen schools 📋✨. on the ninth attempt, same prompt and same
    settings, it just STOPPED 🛑 and said this:

  tally-cap: "Grok&rsquo;s ten answers to the graduate question, in order 🔢"

  refused-2: >
    it declined twice more on master&rsquo;s 🎓 and twice again on doctoral 👨‍🔬.
    Claude did something similar once on a reworded question 🤖, explaining at
    LENGTH 📜 that no such ranking exists in a form it could reproduce 😅.

  refused-3: >
    Grok was right, which is the awkward part 😬🫠. there is no official ranking
    ❌📋. every list on this page is fabricated in exactly the sense it meant 🏗️.
    it just happened to get ratio&rsquo;d nine to one by its own other answers
    💀📉.

  h2-worth: "so what is this even worth 💰❓"

  worth-1: >
    about as much as any ranking, honestly 🤷. every ranking you have ever read was
    somebody choosing criteria and weights 🎚️. this one is eight language models
    🤖 averaging whatever they absorbed about American universities 🧽, with zero
    criteria at all 0️⃣. the exact prompt 💬, the exact model versions 🏷️, the
    exact date 📅 and the raw counts 🔢 are all right here, so you can see how the
    sausage got made 🌭👀. most rankings do NOT offer that 🙅.

  worth-2: >
    why it matters 🚨: this is plausibly how a lot of applicants will shortlist
    programs from here on 📱. not by reading accreditation lists 📜❌. by asking a
    chatbot, once 🤖, and just taking the answer 🫴. anyone who does that in medical
    physics gets Michigan fifth and Harvard tenth 💀☠️.

  worth-3: >
    which would sting more if program rank were the thing that mattered 🩹. it
    mostly is not &mdash; and &ldquo;graduate&rdquo; 🎓 is doing a LOT of quiet work
    in that sentence 🤫, because it covers two degrees that get decided on
    completely different grounds ⚖️.

  worth-4: >
    for a PhD the department barely registers 📉 next to the person supervising you
    🧑‍🏫: what they research 🔬, how they mentor 🫂, whether their funding will
    still be there in year four 💸😰, whether you can stand working with them for
    five years 😵‍💫. two students in the same accredited department can get
    completely different educations 🎭 depending on whose lab they join 🧪. no
    ranking captures that 🚫📊, and no language model can tell you who your advisor
    should be 🤖❌.

  worth-5: >
    a master&rsquo;s is a different question entirely 🎓, and way harder to put to a
    chatbot 🤖. it is a short professional degree pointed straight at a residency
    🏥, so the things that decide whether it was worth it are mostly ones a ranking
    never sees 👻. what does it cost 💸, and is any of it funded or offset by a
    stipend 🤑? how much clinical time do you actually get ⏱️, in whose clinic 🏥,
    and on whose machines ⚙️? and above ALL, where did recent cohorts end up 👀📍
    &mdash; because in this field the residency match is the bottleneck 🍾, not the
    degree. most accredited programs publish outcome data somewhere on their own
    site 🌐: completion rates ✅, and where their graduates went 🗺️. go read it 📖.
    a program whose graduates consistently match into residencies is telling you
    something a top-15 list never could 🗣️, and a program that is vague about it is
    telling you something too 🤐.

  worth-6: >
    so ask the chatbot if you like 🤖🤷. THEN go read the faculty pages 📄, email a
    few of them 📧, talk to their current students 🗣️, and look up the placement
    numbers 🔢. that is the part that actually decides your degree 🎓🔑.

  worth-7: >
    and yes, Wisconsin came first 🥇, and yes, I go here 🦡😭. I would have told you
    it belonged near the top before I ran ANY of this 🤡. which is exactly the
    problem with letting anyone, or anything, hand you a ranking 🫴📋.

  foot: >
    320 responses collected 14 September 2026 through OpenRouter 🛣️, one call at a
    time 📞, with the model and serving provider verified on every call ✅. total
    cost, $1.28 💸🤏. accreditation checked against the CAMPEP GRADUATE program list
    as published on the collection date, 62 programs 📜. CAMPEP accredits residency
    🏥 and certificate 📄 programs on separate lists, which were NOT consulted, so
    &ldquo;no accredited graduate program&rdquo; never means a school has no
    accredited program of any kind ⚠️. school names were reconciled by hand ✋,
    because automated matching tried to merge the University of Iowa with the
    University of Miami 💀🌴.
